<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BROADMIND - starter page schematic</title>
<!--
  BROADMIND starter page - black-and-white outline schematic, animated.
  Brand rules applied: ink #000 on white, one grey #D5D5D5 for rules, text grey #595959 for
  secondary copy, square corners, no gradients, no second colour. The mark is not redrawn.

  This is the design reference for the in-app starter screen. The four stills next to it
  (starter-1..4.png) are frames of exactly this sequence.
-->
<style>
  :root { --ink:#000; --paper:#fff; --line:#D5D5D5; --text:#595959; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--paper); color:var(--ink);
              font-family:Helvetica,Arial,sans-serif; }
  .stage { position:relative; width:min(1180px,94vw); margin:6vh auto; aspect-ratio:16/10; }

  /* --- text column --- */
  .kicker { position:absolute; left:0; top:6%; font-size:13px; letter-spacing:.18em;
            color:var(--text); text-transform:uppercase; }
  h1 { position:absolute; left:0; top:11%; margin:0; font-weight:400;
       font-family:Georgia,"Times New Roman",serif; font-size:clamp(28px,4.2vw,54px); }
  .body { position:absolute; left:0; top:29%; width:38%; font-size:clamp(13px,1.4vw,20px);
          line-height:1.5; color:var(--text); }
  .rule { position:absolute; left:0; top:3%; width:1px; height:82%; background:var(--line); }

  /* --- the schematic --- */
  svg { position:absolute; right:0; top:4%; width:66%; height:92%; overflow:visible; }
  .stroke { fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .thin   { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .contact { fill:var(--paper); stroke:var(--ink); stroke-width:2.4; }

  /* headset sits above the head, then lowers onto it */
  #headset { animation: lower 9s ease-in-out infinite; }
  @keyframes lower {
    0%, 8%    { transform: translateY(-34px); opacity:.35; }
    22%, 34%  { transform: translateY(0);     opacity:1; }
    100%      { transform: translateY(0);     opacity:1; }
  }
  /* contacts ink in once seated */
  #contacts .contact { animation: ink 9s ease-in-out infinite; }
  @keyframes ink {
    0%, 26%  { fill:var(--paper); }
    36%,100% { fill:var(--ink); }
  }
  /* cable draws from the band into the laptop */
  #cable { stroke-dasharray: 1000; stroke-dashoffset: 1000;
           animation: draw 9s ease-in-out infinite; }
  @keyframes draw {
    0%, 46%  { stroke-dashoffset: 1000; }
    68%,100% { stroke-dashoffset: 0; }
  }
  #laptop { opacity:0; animation: show 9s ease-in-out infinite; }
  @keyframes show { 0%,44% {opacity:0;} 56%,100% {opacity:1;} }

  /* --- footer controls --- */
  .dots { position:absolute; left:0; bottom:14%; display:flex; gap:14px; }
  .dot { width:9px; height:9px; border:1.4px solid var(--ink); border-radius:50%; }
  .dot.on { background:var(--ink); }
  .cta { position:absolute; left:0; bottom:4%; padding:16px 30px; border:0; cursor:pointer;
         background:var(--ink); color:var(--paper); font:inherit; font-size:13px;
         letter-spacing:.14em; text-transform:uppercase; }
  .cta:hover { background:#fff; color:#000; outline:2px solid #000; }
  .step { position:absolute; right:0; bottom:6.5%; font-size:13px; color:var(--text);
          letter-spacing:.1em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="stage">
  <div class="rule"></div>
  <div class="kicker">01 &mdash; Set up</div>
  <h1>Put the headset on.</h1>
  <div class="body">
    Eight dry contacts settle on CP1, CP2, C3, C4, CP5, CP6, FT7 and FT8.
    No gel, no paste. Then connect USB-C and start recording.
  </div>

  <svg viewBox="0 0 600 600" role="img"
       aria-label="Schematic: the BROADMIND headband lowering onto a head, then a USB-C cable connecting it to a laptop.">
    <!-- head, in profile, facing right -->
    <path class="stroke" d="M 300 100 C 358 100 392 148 396 200 C 398 224 390 236 388 246
      C 388 256 404 266 414 274 C 420 280 414 288 402 290
      C 394 292 398 302 400 308 C 402 316 394 322 386 326
      C 380 330 386 342 380 352 C 372 364 352 368 338 372
      C 332 384 332 404 332 428 L 332 452 L 262 452
      C 262 404 264 386 264 372 C 252 336 242 300 240 266
      C 236 214 240 148 300 100 Z"/>
    <!-- ear -->
    <path class="thin" d="M 298 292 C 316 289 326 303 324 317 C 322 333 309 341 296 338
      C 286 335 283 320 286 308 C 288 300 291 293 298 292 Z"/>

    <!-- the device: band over the skull, eight contacts -->
    <g id="headset">
      <path class="stroke" d="M 250 208 C 254 152 348 150 392 206"/>
      <g id="contacts">
        <circle class="contact" cx="250" cy="208" r="6"/>
        <circle class="contact" cx="262" cy="186" r="6"/>
        <circle class="contact" cx="282" cy="169" r="6"/>
        <circle class="contact" cx="307" cy="160" r="6"/>
        <circle class="contact" cx="334" cy="162" r="6"/>
        <circle class="contact" cx="357" cy="174" r="6"/>
        <circle class="contact" cx="375" cy="190" r="6"/>
        <circle class="contact" cx="388" cy="204" r="6"/>
      </g>
    </g>

    <!-- cable from the band into the machine -->
    <path id="cable" class="thin" d="M 250 208 C 210 236 190 320 214 392
      C 234 446 300 480 396 494 C 440 500 470 502 486 504"/>

    <!-- the machine -->
    <g id="laptop">
      <rect class="stroke" x="506" y="432" width="140" height="68"/>
      <rect class="thin" x="522" y="448" width="108" height="38"/>
      <rect class="stroke" x="496" y="500" width="160" height="16"/>
      <rect class="contact" x="460" y="494" width="32" height="20" rx="3"/>
      <rect x="448" y="499" width="12" height="10" fill="#000"/>
    </g>
  </svg>

  <div class="dots"><span class="dot on"></span><span class="dot on"></span><span class="dot on"></span></div>
  <button class="cta">Start session</button>
  <div class="step">03 &mdash; Connect</div>
</div>
</body>
</html>
